name: clash_command
description: "A personal offline-first Clash of Clans builder tracker."
publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.10.0
  timezone: ^0.9.4
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
